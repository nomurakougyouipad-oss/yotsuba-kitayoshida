<style>
/* 現場向けの業務アプリ：大きな数字と大きなボタン、会社カラーの深緑 */
:root{--g:#1f5d3a;--gd:#143d27;--gl:#e6f0ea;--ink:#1a1a1a;--sub:#5f6661;--line:#dde2de;--bg:#f3f5f3;--card:#ffffff;--red:#c62828;--redl:#fdecea;--redline:#f3c2bd;--tagbg:#c62828;--amber:#8a5a00;--amberl:#fff6dc;--orange:#b0561a;--outbtn:#b0561a;--onacc:#ffffff;--hdr:#ffffff;--shadow:rgba(0,0,0,.25);--scrim:rgba(0,0,0,.45);--font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g:#2f7d52;--gd:#0f2a1b;--gl:#1d3327;--ink:#ecefec;--sub:#a3aca6;--line:#2e3631;--bg:#121513;--card:#1b201d;--red:#ef6b63;--redl:#3a1d1b;--redline:#6b2f2b;--tagbg:#b3302a;--amber:#f0c060;--amberl:#3a2f12;--orange:#e89a5e;--outbtn:#a8541c;--shadow:rgba(0,0,0,.6);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--g:#2f7d52;--gd:#0f2a1b;--gl:#1d3327;--ink:#ecefec;--sub:#a3aca6;--line:#2e3631;--bg:#121513;--card:#1b201d;--red:#ef6b63;--redl:#3a1d1b;--redline:#6b2f2b;--tagbg:#b3302a;--amber:#f0c060;--amberl:#3a2f12;--orange:#e89a5e;--outbtn:#a8541c;--shadow:rgba(0,0,0,.6);--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--gd)}
button,select,input{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:3px solid var(--g);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--gd);color:var(--hdr);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
header h1{font-size:18px;font-weight:700;flex:1;line-height:1.3}
header h1 small{display:block;font-size:12px;font-weight:400;opacity:.75}
.icon-btn{background:rgba(255,255,255,.14);border:none;color:var(--hdr);border-radius:10px;padding:8px 14px;font-size:14px}
.icon-btn.on{background:var(--hdr);color:#143d27;font-weight:700}
#modeBar{display:none;background:var(--amberl);color:var(--amber);font-size:13px;padding:8px 16px;text-align:center;line-height:1.5}
main{max-width:640px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:none}.view.show{display:block}
.alert{display:flex;align-items:center;gap:10px;background:var(--redl);color:var(--red);border:1.5px solid var(--redline);border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:12px;width:100%;font-size:15px;text-align:left}
.search{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:var(--card);color:var(--ink);margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink)}
.chip.on{background:var(--g);border-color:var(--g);color:var(--onacc);font-weight:700}
.chip.warn{color:var(--red);border-color:var(--redline)}
.chip.warn.on{background:var(--tagbg);border-color:var(--tagbg);color:var(--onacc)}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px;border:1px solid var(--line);width:100%;text-align:left;color:inherit;font:inherit}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--gl);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--g)}
.card .info{flex:1;min-width:0}
.card .name{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cat{font-size:12px;color:var(--sub);margin-top:3px}
.card .where{font-size:13px;color:var(--orange);font-weight:700;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.qty b{font-size:26px}
.qty span{font-size:13px;color:var(--sub)}
.qty .lbl{font-size:11px;color:var(--sub)}
.tag{display:inline-block;background:var(--tagbg);color:var(--onacc);font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:4px}
.low{border-color:var(--redline)}
.low .qty b{color:var(--red)}
.empty{text-align:center;color:var(--sub);padding:48px 10px;line-height:1.9}
h2{font-size:15px;color:var(--sub);margin:16px 2px 8px}
.site{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.site h3{font-size:17px;margin-bottom:6px}
.site li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:15px;cursor:pointer}
.allback{display:block;width:100%;margin-top:10px}
.chklist{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px;cursor:pointer}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--g)}
.chk span{flex:1;min-width:0}
.chk b{flex:none;font-variant-numeric:tabular-nums}
.log{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;align-items:flex-start;line-height:1.5}
.log .badge{flex:none;font-size:12px;font-weight:700;border-radius:6px;padding:3px 7px;color:var(--onacc);background:var(--sub)}
.badge.out{background:var(--outbtn)}.badge.in{background:var(--g)}
.log .when{color:var(--sub);font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:10}
nav button{flex:1;border:none;background:none;padding:10px 0 12px;font-size:13px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:22px}
nav button.on{color:var(--g);font-weight:700}
#fab{display:none;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--g);color:var(--onacc);border:none;border-radius:999px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 4px 14px var(--shadow);z-index:11}
#sheetBg{display:none;position:fixed;inset:0;background:var(--scrim);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;z-index:21;padding-top:18px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transform:translateY(105%);transition:transform .2s;max-width:640px;margin:0 auto}
#sheet.show{transform:none}
@media (prefers-reduced-motion: reduce){#sheet,#toast{transition:none}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h2{flex:1;margin:0;font-size:19px;color:var(--ink);min-width:0}
.close{flex:none;border:none;background:var(--bg);border-radius:999px;width:38px;height:38px;font-size:18px;color:var(--ink)}
.photo{width:100%;max-width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--gl);display:block;margin-bottom:12px}
.big{display:flex;gap:8px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.big div{flex:1;background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center;font-size:13px}
.big small{display:block;font-size:12px;color:var(--sub)}
.big b{font-size:28px}
.big .main{background:var(--gl)}
.btns{display:flex;gap:10px;margin:12px 0}
.btn{flex:1;border:none;border-radius:12px;padding:16px 10px;font-size:18px;font-weight:700;color:var(--onacc);background:var(--g)}
.btn.out{background:var(--outbtn)}
.btn.sub{background:var(--bg);color:var(--ink);font-size:15px;padding:13px}
.btn.danger{background:var(--redl);color:var(--red);font-size:15px;padding:13px}
.btn:disabled{opacity:.35}
label.f{display:block;font-size:14px;color:var(--sub);margin:14px 0 6px}
.in{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:17px;background:var(--card);color:var(--ink)}
.step{display:flex;align-items:center;gap:10px}
.step button{flex:none;width:56px;height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:26px;color:var(--ink)}
.step input{text-align:center;font-size:24px;font-weight:700;min-width:0}
.pin{text-align:center;font-size:28px;letter-spacing:.4em;font-weight:700}
.note{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.6}
.photobtn{display:block;text-align:center;background:var(--gl);color:var(--g);border:1.5px dashed var(--g);border-radius:12px;padding:16px;font-size:16px;font-weight:700;margin-bottom:12px;cursor:pointer}
.photobtn.small{display:inline-block;background:none;border:none;padding:0 0 4px;font-size:14px;margin:-4px 0 10px}
.photobtn:focus-within{outline:3px solid var(--g);outline-offset:2px}
.nocount{display:inline-block;font-size:14px;font-weight:700;color:var(--sub);border:1.5px dashed var(--line);border-radius:8px;padding:4px 8px;margin-top:2px}
.infobox{background:var(--bg);color:var(--sub);border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.6}
.warnbox{background:var(--redl);color:var(--red);border-radius:10px;padding:10px 12px;font-weight:700;margin-bottom:12px;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>

// ---------------- データの保存先 ----------------
let DB;
if (FIREBASE_CONFIG && window.firebase) {
  firebase.initializeApp(FIREBASE_CONFIG);
  const root = firebase.database().ref(ROOT);
  DB = {
    newId: () => root.child('items').push().key,
    listen() {
      const bar = $('#modeBar');
      bar.textContent = 'つないでいます…'; bar.style.display = 'block';
      firebase.auth().signInAnonymously().then(() => {
        bar.style.display = 'none';
        this.start();
      }).catch(() => {
        bar.textContent = 'データにつながりません。電波を確認して、ページを開き直してください';
      });
    },
    start() {
      root.child('items').on('value', s => { items = s.val() || {}; render(); });
      root.child('logs').limitToLast(300).on('value', s => {
        logs = Object.values(s.val() || {}).sort((a, b) => b.at - a.at); render();
      });
    },
    setItem: (id, it) => root.child('items/' + id).set(it),
    bulkSet: obj => root.child('items').update(obj),
    async removeItem(id) { await root.child('items/' + id).remove(); await root.child('photos/' + id).remove(); await root.child('thumbs/' + id).remove(); },
    setPhoto: (id, d) => root.child('photos/' + id).set(d),
    async getPhoto(id) { return (await root.child('photos/' + id).once('value')).val(); },
    setThumb: (id, d) => root.child('thumbs/' + id).set(d),
    async getThumb(id) { return (await root.child('thumbs/' + id).once('value')).val(); },
    async mutate(id, fn) {
      const r = await root.child('items/' + id).transaction(cur => cur ? fn(cur) : cur);
      return r.committed && r.snapshot.val();
    },
    log: l => root.child('logs').push(l)
  };
} else {
  const KEY = 'kitayoshida-demo-v3';
  let mem = null;
  try { mem = JSON.parse(ls.get(KEY)); } catch (e) { }
  if (!mem) mem = seed();
  const save = () => ls.set(KEY, JSON.stringify(mem));
  const sync = () => {
    items = JSON.parse(JSON.stringify(mem.items));
    logs = Object.values(mem.logs).sort((a, b) => b.at - a.at).slice(0, 300);
    save(); render();
  };
  DB = {
    newId: () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    listen() {
      const bar = $('#modeBar');
      bar.textContent = FIREBASE_CONFIG
        ? 'Firebaseにつながりません。お試しモードで動いています'
        : 'お試しモード：データはこの端末の中だけに保存されます';
      bar.style.display = 'block';
      sync();
    },
    async setItem(id, it) { mem.items[id] = it; sync(); },
    async bulkSet(obj) { Object.assign(mem.items, obj); sync(); },
    async removeItem(id) { delete mem.items[id]; delete mem.photos[id]; delete (mem.thumbs || {})[id]; sync(); },
    async setPhoto(id, d) { mem.photos[id] = d; save(); },
    async getPhoto(id) { return mem.photos[id] || null; },
    async setThumb(id, d) { (mem.thumbs = mem.thumbs || {})[id] = d; save(); },
    async getThumb(id) { return (mem.thumbs || {})[id] || null; },
    async mutate(id, fn) {
      const cur = mem.items[id]; if (!cur) return null;
      const r = fn(JSON.parse(JSON.stringify(cur)));
      if (r === undefined) return null;
      mem.items[id] = r; sync(); return r;
    },
    async log(l) { mem.logs['l' + Date.now() + Math.random().toString(36).slice(2, 6)] = l; sync(); }
  };
}

  async get(id) {
    const db = await this.open(); if (!db) return null;
    return new Promise(ok => {
      try { const r = db.transaction('t').objectStore('t').get(id); r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null); }
      catch (e) { ok(null); }
    });
  },
  async put(id, val) {
    const db = await this.open(); if (!db) return;
    try { db.transaction('t', 'readwrite').objectStore('t').put(val, id); } catch (e) { }
  }
};
const hasPhoto = it => !!(it && (it.thumbVer || it.thumb));
function thumbSrc(id, it) {
  if (!it) return '';
  if (it.thumb) return it.thumb;                       // 古い形（物のデータの中に写真）
  const m = thumbMem[id];
  return (m && m.v === it.thumbVer) ? m.data : '';
}
let thumbBusy = false, thumbAgain = false;
async function ensureThumbs() {
  if (thumbBusy) { thumbAgain = true; return; }
  thumbBusy = true;
  try {
    const need = Object.entries(items).filter(([id, it]) => it.thumbVer && !it.thumb && !(thumbMem[id] && thumbMem[id].v === it.thumbVer)).map(([id]) => id);
    let changed = false;
    for (let i = 0; i < need.length; i += 6) {
      await Promise.all(need.slice(i, i + 6).map(async id => {
        const v = items[id] && items[id].thumbVer; if (!v) return;
        const c = await TC.get(id);
        if (c && c.v === v) { thumbMem[id] = c; changed = true; return; }
        const data = await DB.getThumb(id);       // スマホにない・古いときだけ読みこむ
        if (data) { const val = { v, data }; thumbMem[id] = val; TC.put(id, val); changed = true; }
      }));
    }
    if (changed) render();
  } catch (e) { }
  thumbBusy = false;
  if (thumbAgain) { thumbAgain = false; ensureThumbs(); }
}
async function saveThumb(id, data) {
  const v = Date.now();
  await DB.setThumb(id, data);
  const val = { v, data }; thumbMem[id] = val; TC.put(id, val);
  return v;
}

async function doUse(type) {

async function doMove(type) {
  const id = openId, it = items[id]; if (!it) return;
  const site = $('#fSite').value.trim();
  const qty = parseInt($('#fQty').value, 10);
  const person = $('#fPerson').value.trim();
  if (!site) return toast('現場名を入れてください');
  if (!(qty > 0)) return toast('数を入れてください');
  if (!person) return toast('名前を入れてください');
  ls.set('kyd-person', person);
  const k = keyOf(site);
  try {
    const r = await DB.mutate(id, cur => {
      cur.out = cur.out || {};
      if (type === 'out') {
        if ((cur.inStock || 0) < qty) return;
        cur.inStock = (cur.inStock || 0) - qty;
        const o = cur.out[k] || { site, qty: 0 };
        o.qty += qty; cur.out[k] = o;
      } else {
        const o = cur.out[k];
        if (!o || o.qty < qty) return;
        o.qty -= qty;
        if (o.qty === 0) delete cur.out[k];
        cur.inStock = (cur.inStock || 0) + qty;
      }
      cur.updated = Date.now();
      return cur;
    });
    if (!r) return toast('数が足りません。もう一度確認してください');
    await DB.log({ t: type, itemId: id, name: it.name, unit: it.unit, qty, site, person, at: Date.now() });
    toast(type === 'out' ? '持ち出しを記録しました' : '返却を記録しました');
    closeSheet();
  } catch (e) { toast('保存できませんでした。電波を確認してください'); }
}

// ---------------- 登録・編集（管理モード） ----------------
function openEdit(id) {
  const it = id ? items[id] : { name: '', cat: CATEGORIES[0], unit: UNITS[0], total: 0, min: 0 };
  if (!it) return;
  editId = id || null; openId = id || null; pendingPhoto = null;
  openSheet(`
    <div class="sheet-head"><h2>${id ? '編集' : '新しく登録'}</h2><button class="close" data-act="${id ? 'back' : 'close'}">✕</button></div>
    <img class="photo" id="pv" src="${id ? thumbSrc(id, it) : ''}" style="${id && hasPhoto(it) ? '' : 'display:none'}" alt="">
    <label class="btn sub" style="display:block;text-align:center">📷 写真を${id && hasPhoto(it) ? '取り直す' : 'とる・えらぶ'}<input type="file" id="fPhoto" accept="image/*" hidden></label>
    <label class="f">名前</label>
    <input class="in" id="eName" value="${esc(it.name)}" placeholder="例：チェーンブロック 1t">
    <label class="f">分類</label>
    <select class="in" id="eCat">${CATEGORIES.map(c => `<option ${c === it.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
    <label class="f">数え方</label>
    <select class="in" id="eUnit">${UNITS.map(u => `<option ${u === it.unit ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>
    <label class="f">${isUse(it) ? 'いま倉庫にいくつある？' : '全部でいくつある？（現場に出ている分もふくむ）'}</label>
    <input class="in" id="eTotal" type="number" inputmode="numeric" value="${it.total || 0}" min="0">
    ${id && outTotal(it) ? `<div class="note">いま現場に ${outTotal(it)}${esc(it.unit)} 出ています。これより少なくはできません。</div>` : ''}
    <label class="f">いくつより少なくなったら知らせる？</label>
    <input class="in" id="eMin" type="number" inputmode="numeric" value="${it.min || 0}" min="0">
    <div class="note">倉庫にある数がこの数より少なくなると、赤くお知らせします。0なら知らせません。</div>
    <label class="f" for="eMemo">メモ（なくてもOK）</label>
    <input class="in" id="eMemo" value="${esc(it.memo || '')}" placeholder="例：4個は皿なし">
    ${it.memo && it.memo.startsWith('エクセル:') ? '<div class="note">「エクセル:」はエクセルに書いてあった数の書き方です。数を確かめたら消してOKです。</div>' : ''}
    <div class="btns" style="margin-top:22px"><button class="btn" data-act="saveEdit">保存する</button></div>
    ${id ? `<div class="btns"><button class="btn danger" data-act="delete">この物を消す</button></div>` : ''}
  `);
}

async function saveEdit() {
  const name = $('#eName').value.trim();
  const cat = $('#eCat').value, unit = $('#eUnit').value;
  const total = Math.max(0, parseInt($('#eTotal').value, 10) || 0);
  const min = Math.max(0, parseInt($('#eMin').value, 10) || 0);
  const memo = $('#eMemo').value.trim();
  if (!name) return toast('名前を入れてください');
  const isNew = !editId;
  const id = editId || DB.newId();
  const who = ls.get('kyd-person') || '管理者';
  try {
    let tv = null;
    if (pendingPhoto) { await DB.setPhoto(id, pendingPhoto.full); tv = await saveThumb(id, pendingPhoto.thumb); }
    if (isNew) {
      const ni = { name, cat, unit, total, min, memo, inStock: total, out: {}, updated: Date.now() };
      if (tv) ni.thumbVer = tv;
      await DB.setItem(id, ni);
      await DB.log({ t: 'new', itemId: id, name, unit, qty: total, person: who, at: Date.now() });
      toast('登録しました'); closeSheet();
    } else {
      let before = null;
      const r = await DB.mutate(id, cur => {
        const out = outTotal(cur);
        if (total < out) return;
        before = cur.total || 0;
        Object.assign(cur, { name, cat, unit, min, memo, total, inStock: total - out, nocount: false, updated: Date.now() });
        if (tv) { cur.thumbVer = tv; delete cur.thumb; }
        return cur;
      });
      if (!r) return toast('現場に出ている数より少なくはできません');
      if (before !== total) await DB.log({ t: 'edit', itemId: id, name, unit, memo: `全部の数 ${before}→${total}`, person: who, at: Date.now() });
      toast('保存しました');
      setTimeout(() => openItem(id), 50);
    }
  } catch (e) { toast('保存できませんでした。電波を確認してください'); }
}

function askDelete() {
  const it = items[editId]; if (!it) return;
  openSheet(`
    <div class="sheet-head"><h2>消しますか？</h2><button class="close" data-act="back">✕</button></div>
    <div class="warnbox">「${esc(it.name)}」を一覧から消します</div>
    <div class="note">これまでの記録は残ります。</div>
    <div class="btns" style="margin-top:20px">
      <button class="btn sub" data-act="back">やめる</button>
      <button class="btn danger" data-act="delOk">消す</button>
    </div>
  `);
}
async function delItem() {
  const id = editId || openId; if (!items[id]) return;
  try { await DB.removeItem(id); toast('消しました'); closeSheet(); }
  catch (e) { toast('消せませんでした'); }
}

// 物の画面から、だれでも写真をのせられる
async function savePhotoQuick(file) {
  const id = openId, it = items[id]; if (!it) return;
  toast('写真を保存しています…');
  try {
    const full = await resize(file, 800, .7), thumb = await resize(file, 160, .6);
    await DB.setPhoto(id, full);
    const tv = await saveThumb(id, thumb);
    const r = await DB.mutate(id, cur => { cur.thumbVer = tv; delete cur.thumb; cur.updated = Date.now(); return cur; });
    if (!r) return toast('保存できませんでした');
    await DB.log({ t: 'photo', itemId: id, name: it.name, person: ls.get('kyd-person') || '', at: Date.now() });
    toast('写真を保存しました');
    setTimeout(() => { if (openId === id) openItem(id); }, 50);
  } catch (e) { toast('写真を保存できませんでした。電波を確認してください'); }
}

function resize(file, max, q) {
  return new Promise((ok, ng) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', q));
    };
    img.onerror = ng; img.src = url;
  });
}

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------------- 操作 ----------------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-v],[data-c],[data-id]');
  if (!t) return;
  const a = t.dataset.act;
  if (a) {
    if (a === 'close') closeSheet();
    else if (a === 'back') openId ? openItem(openId) : closeSheet();
    else if (a === 'moveOut') openMove(openId, 'out');
    else if (a === 'moveIn') openMove(openId, 'in');
    else if (a === 'edit') openEdit(openId);
    else if (a === 'minus' || a === 'plus') {
      const i = $('#fQty');
      const v = (parseInt(i.value, 10) || 0) + (a === 'plus' ? 1 : -1);
      i.value = Math.min(Math.max(1, v), curMax());
    }
    else if (a === 'doMove') doMove(t.dataset.type);
    else if (a === 'saveEdit') saveEdit();
    else if (a === 'delete') askDelete();
    else if (a === 'delOk') delItem();
    else if (a === 'pinOk') checkPin();
    else if (a === 'importInit') importInitial();
    else if (a === 'moveUse') openUse(openId, 'use');
    else if (a === 'moveAdd') openUse(openId, 'add');
    else if (a === 'doUse') doUse(t.dataset.type);
    else if (a === 'returnAll') openReturnAll(t.dataset.site);
    else if (a === 'doReturnAll') doReturnAll();
    return;
  }
  if (t.dataset.v) {
    view = t.dataset.v;
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b === t));
    document.querySelectorAll('.view').forEach(s => s.classList.toggle('show', s.id === 'view-' + view));
    window.scrollTo(0, 0); render(); return;
  }
  if (t.dataset.c) { filter = t.dataset.c; renderList(); return; }
  if (t.dataset.id) openItem(t.dataset.id);
});

document.addEventListener('change', async e => {
  if (e.target.id === 'fPhoto' && e.target.files[0]) {
    const f = e.target.files[0];
    try {
      const full = await resize(f, 800, .7), thumb = await resize(f, 160, .6);
      pendingPhoto = { full, thumb };
      const pv = $('#pv'); pv.src = full; pv.style.display = 'block';
    } catch (err) { toast('写真を読み込めませんでした'); }
  }
  if (e.target.id === 'fPhotoQuick' && e.target.files[0]) savePhotoQuick(e.target.files[0]);
  if (e.target.id === 'fSite' && e.target.tagName === 'SELECT') updateMax();
});

$('#q').addEventListener('input', e => { query = e.target.value.trim(); renderList(); });
$('#lowAlert').onclick = () => { filter = 'low'; renderList(); };
$('#sheetBg').onclick = closeSheet;
$('#fab').onclick = () => openEdit(null);
$('#adminBtn').onclick = () => {
  if (admin) { admin = false; render(); toast('管理モードを終わりました'); if (openId) openItem(openId); return; }
  openId = null; editId = null;
  openSheet(`
    <div class="sheet-head"><h2>管理モード</h2><button class="close" data-act="close">✕</button></div>
    <label class="f" for="fPin">暗証番号を入れてください</label>
    <input class="in pin" id="fPin" type="password" inputmode="numeric" autocomplete="off">
    <div class="btns" style="margin-top:20px"><button class="btn" data-act="pinOk">入る</button></div>
  `);
  setTimeout(() => { const i = $('#fPin'); if (i) i.focus(); }, 250);
};
function checkPin() {
  if ($('#fPin').value === ADMIN_PIN) { admin = true; closeSheet(); render(); toast('管理モードになりました'); }
  else { toast('番号がちがいます'); $('#fPin').value = ''; }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'fPin') checkPin(); });

DB.listen();
</script>
</body>
